services:
  db:
    image: postgres:15-alpine
    container_name: frulex-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-frulex}
      POSTGRES_USER: ${POSTGRES_USER:-frulex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-frulex}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-frulex} -d ${POSTGRES_DB:-frulex}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: frulex-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://${POSTGRES_USER:-frulex}:${POSTGRES_PASSWORD:-frulex}@db:5432/${POSTGRES_DB:-frulex}}
      SECRET_KEY: ${SECRET_KEY:-change-this-secret-key}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
    container_name: frulex-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data:
